<div class="form-page">

  <div class="form-card">

    <!-- Header -->

    <div class="header">

      <div>

        <h2>

          <i class="bi bi-journal-text"></i>

          {{ isEdit ? 'Edit Course Subject' : 'New Course Subject' }}

        </h2>

        <p>

          Assign subjects to courses

        </p>

      </div>

    </div>



    <form
      [formGroup]="form"
      (ngSubmit)="save()">

      <!-- Course -->

      <div class="form-group">

        <label>

          Course <span>*</span>

        </label>

        <select
          formControlName="courseId">

          <option value="">
            -- Select Course --
          </option>

          <option
            *ngFor="let item of courses"
            [value]="item.id">

            {{ item.courseName }}

          </option>

        </select>

      </div>



      <!-- Subject -->

      <div class="form-group">

        <label>

          Subject <span>*</span>

        </label>

        <select
          formControlName="subjectId">

          <option value="">
            -- Select Subject --
          </option>

          <option
            *ngFor="let item of subjects"
            [value]="item.id">

            {{ item.name }}

          </option>

        </select>

      </div>



      <!-- Display Order -->

      <div class="form-group">

        <label>

          Display Order

        </label>

        <input
          type="number"
          formControlName="displayOrder"
          placeholder="Enter display order">

      </div>



      <!-- Mandatory -->

      <div class="checkbox-group">

        <label>

          <input
            type="checkbox"
            formControlName="isMandatory">

          Mandatory Subject

        </label>

      </div>



      <!-- Buttons -->

      <div class="buttons">

        <button
          type="submit"
          class="btn-save"
          [disabled]="isSaving">

          <i class="bi bi-check-circle-fill"></i>

          {{ isEdit ? 'Update' : 'Save' }}

        </button>

        <button
          type="button"
          class="btn-cancel"
          (click)="cancel()">

          <i class="bi bi-arrow-left-circle-fill"></i>

          Cancel

        </button>

      </div>

    </form>

  </div>

</div>
