<div class="form-container">


<div class="form-header">

<h2>

{{isEdit?'Edit Course':'Create Course'}}

</h2>

</div>




<form
(ngSubmit)="save()">


<div class="form-group">


<label>
Class
</label>


<select
[(ngModel)]="model.classId"
name="classId"
required>


<option value="">

Select Class

</option>


<option
*ngFor="let item of classes"
[value]="item.id">


{{item.name}}


</option>


</select>


</div>






<div class="form-group">


<label>
Course Name
</label>


<input

type="text"

name="courseName"

[(ngModel)]="model.courseName"

placeholder="Enter course name"

required>


</div>







<div class="form-group">


<label>
Course Code
</label>


<input

type="text"

name="courseCode"

[(ngModel)]="model.courseCode"

placeholder="Enter course code"

required>


</div>








<div class="form-group">


<label>
Description
</label>


<textarea

name="description"

[(ngModel)]="model.description"

placeholder="Enter description">

</textarea>


</div>







<div class="form-group">


<label>
Duration (Months)
</label>


<input

type="number"

name="duration"

[(ngModel)]="model.durationMonths"

placeholder="Example: 12">


</div>








<div
class="form-group checkbox"
*ngIf="isEdit">


<label>

<input

type="checkbox"

[(ngModel)]="isActive"

name="isActive">


Active


</label>


</div>







<div class="actions">


<button

type="button"

class="btn-cancel"

(click)="cancel()">

Cancel

</button>





<button

type="submit"

class="btn-save"

[disabled]="saving">


{{saving?'Saving...':'Save'}}


</button>


</div>





</form>



</div>
