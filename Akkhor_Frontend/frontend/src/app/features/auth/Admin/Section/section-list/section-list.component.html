<div class="container-fluid section-page">

  <!-- HEADER -->
  <div class="top-section">

    <div>

      <h2>
        <i class="bi bi-diagram-3-fill"></i>
        Sections
      </h2>

      <p>
        Manage class sections and room allocations
      </p>

    </div>

    <button
      class="btn-add"
      (click)="addSection()">

      <i class="bi bi-plus-circle-fill"></i>

      New Section

    </button>

  </div>

  <!-- TABLE -->
  <div class="table-card">

    <div class="table-responsive">

      <table class="table align-middle">

        <thead>

          <tr>

            <th>Section</th>

            <th>Class</th>

          

            <th>Room</th>

            <th>Capacity</th>

            <th>Status</th>

            <th width="140">Action</th>

          </tr>

        </thead>

        <tbody>

          <!-- Loading -->

          <tr *ngIf="isLoading">

            <td
              colspan="7"
              class="empty">

              <i class="bi bi-hourglass-split"></i>

              <br>

              Loading sections...

            </td>

          </tr>

          <!-- Data -->

          <tr
            *ngFor="let item of sections">

            <!-- Section -->

            <td>

              <div class="section-box">

                <div class="section-icon">

                  <i class="bi bi-diagram-3"></i>

                </div>

                <div>

                  <strong>

                    {{ item.sectionName }}

                  </strong>

                  <small>

                    Class Section

                  </small>

                </div>

              </div>

            </td>

            <!-- Class -->

            <td>

              <span class="class-badge">

                {{ item.className }}

              </span>

            </td>

           

           

            <!-- Room -->

            <td>

              {{ item.roomNumber || '-' }}

            </td>

            <!-- Capacity -->

            <td>

              {{ item.capacity ?? '-' }}

            </td>

            <!-- Status -->

            <td>

              <span

                class="status"

                [class.active]="item.isActive"

                [class.inactive]="!item.isActive">

                <i
                  class="bi"
                  [ngClass]="item.isActive
                    ? 'bi-toggle-on'
                    : 'bi-toggle-off'">
                </i>

                {{ item.isActive ? 'Active' : 'Inactive' }}

              </span>

            </td>

            <!-- Actions -->

            <td class="actions">

              <button

                class="action-btn edit-btn"

                title="Edit Section"

                (click)="editSection(item.id)">

                <i class="bi bi-pencil-square"></i>

              </button>

              <button

                class="action-btn delete-btn"

                title="Delete Section"

                (click)="deleteSection(item.id)">

                <i class="bi bi-trash3-fill"></i>

              </button>

            </td>

          </tr>

          <!-- Empty -->

          <tr
            *ngIf="!isLoading && sections.length === 0">

            <td
              colspan="7"
              class="empty">

              <i class="bi bi-folder-x"></i>

              <br>

              No sections found

            </td>

          </tr>

        </tbody>

      </table>

    </div>

  </div>

</div>
