<div class="container-fluid academic-page">


    <!-- HEADER -->

    <div class="top-section">


        <div>

            <h2>

                <i class="bi bi-calendar-range"></i>

                Academic Years

            </h2>


            <p>
                Manage academic sessions and yearly periods
            </p>


        </div>



        <button 
            class="btn-add"
            (click)="addAcademicYear()">


            <i class="bi bi-plus-circle"></i>

            Add Academic Year


        </button>


    </div>





    <!-- TABLE CARD -->


    <div class="content-card">


        <div class="table-responsive">


            <table class="table">


                <thead>

                    <tr>

                        <th>
                            Academic Year
                        </th>


                        <th>
                            Start Date
                        </th>


                        <th>
                            End Date
                        </th>


                        <th>
                            Status
                        </th>


                        <th class="text-center">
                            Action
                        </th>


                    </tr>

                </thead>



                <tbody>


                    <tr *ngFor="let year of years">


                        <td>

                            <div class="year-name">

                                <div class="icon-box">

                                    <i class="bi bi-calendar-event"></i>

                                </div>


                                <span>
                                    {{year.name}}
                                </span>


                            </div>


                        </td>



                        <td>

                            {{year.startDate | date:'dd MMM yyyy'}}

                        </td>



                        <td>

                            {{year.endDate | date:'dd MMM yyyy'}}

                        </td>




                        <td>


                            <span 
                            class="status"
                            [class.active]="year.isActive">


                                <i class="bi"
                                [class.bi-check-circle]="year.isActive"
                                [class.bi-x-circle]="!year.isActive">
                                </i>


                                {{year.isActive ? 'Active':'Inactive'}}


                            </span>


                        </td>




                        <td class="text-center">


                            <button 
                            class="action-btn edit"
                            (click)="editAcademicYear(year.id)">


                                <i class="bi bi-pencil-square"></i>


                            </button>



                            <button 
                            class="action-btn delete"
                            (click)="delete(year.id)">


                                <i class="bi bi-trash"></i>


                            </button>



                        </td>


                    </tr>



                    <tr *ngIf="years.length===0">


                        <td colspan="5"
                        class="empty">


                            No academic years found


                        </td>


                    </tr>



                </tbody>


            </table>


        </div>


    </div>


</div>
