<div class="modal-overlay">


<div class="edit-modal">



<!-- HEADER -->

<div class="modal-header">


<h3>

<i class="bi bi-calendar-event"></i>

Edit Academic Year

</h3>



<button
class="close-btn"
(click)="cancel()">

<i class="bi bi-x-lg"></i>

</button>


</div>





<!-- BODY -->

<div class="modal-body">



<div class="form-group">


<label>
Academic Year Name
</label>


<input
type="text"
class="form-control"
placeholder="Enter academic year"
[(ngModel)]="model.name">


</div>







<div class="form-row">



<div class="form-group">


<label>
Start Date
</label>


<input
type="date"
class="form-control"
[(ngModel)]="model.startDate">


</div>





<div class="form-group">


<label>
End Date
</label>


<input
type="date"
class="form-control"
[(ngModel)]="model.endDate">


</div>



</div>







<div class="active-box">


<input
type="checkbox"
[(ngModel)]="model.isActive">


<label>

Active Academic Year

</label>


</div>




</div>








<!-- FOOTER -->


<div class="modal-footer">



<button
class="btn-cancel"
(click)="cancel()">

Cancel

</button>





<button
class="btn-update"
(click)="update()"
[disabled]="loading">


<i class="bi bi-check-circle"></i>


Update


</button>



</div>



</div>


</div>
