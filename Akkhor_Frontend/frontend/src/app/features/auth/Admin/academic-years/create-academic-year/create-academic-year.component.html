
<div class="academic-form-page">


<div class="top-section">

<div>

<h2>
<i class="bi bi-calendar-plus"></i>

Create Academic Year

</h2>


<p>
Create new academic session
</p>

</div>

</div>




<div class="form-card">


<form [formGroup]="form"
(ngSubmit)="save()">



<div class="row">


<div class="form-group">


<label>
Academic Year Name
</label>


<input 
type="text"
class="form-control"
formControlName="name"
placeholder="Example: 2026-2027">


</div>



<div class="form-group">


<label>
Start Date
</label>


<input
type="date"
class="form-control"
formControlName="startDate">


</div>




<div class="form-group">


<label>
End Date
</label>


<input
type="date"
class="form-control"
formControlName="endDate">


</div>



</div>





<div class="switch">


<input 
type="checkbox"
formControlName="isActive">


<label>
Active Academic Year
</label>


</div>





<div class="buttons">


<button
type="button"
class="btn-cancel"
(click)="cancel()">

Cancel

</button>



<button
type="submit"
class="btn-save">

<i class="bi bi-check-circle"></i>

Save

</button>


</div>



</form>


</div>


</div>
