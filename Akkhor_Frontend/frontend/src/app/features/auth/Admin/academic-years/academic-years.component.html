<div class="container-fluid academic-page">


    <!-- HEADER -->

    <div class="top-section">


        <div>

            <h2>
                <i class="bi bi-calendar-range"></i>
                Academic Years
            </h2>


            <p>
                Manage academic sessions and yearly periods
            </p>


        </div>





        <button
        class="btn-add"
        (click)="addAcademicYear()">


            <i class="bi bi-calendar-plus-fill"></i>

            New Academic Year


        </button>



    </div>








    <!-- TABLE CARD -->


    <div class="table-card">


        <div class="table-responsive">


            <table class="table align-middle">



                <thead>


                    <tr>


                        <th>
                            Academic Year
                        </th>


                        <th>
                            Start Date
                        </th>


                        <th>
                            End Date
                        </th>


                        <th>
                            Status
                        </th>


                        <th>
                            Action
                        </th>


                    </tr>


                </thead>






                <tbody>




                    <tr
                    *ngFor="let year of years">





                        <!-- YEAR -->


                        <td>


                            <div class="year-box">


                                <div class="year-icon">


                                    <i class="bi bi-calendar-event"></i>


                                </div>



                                <div>


                                    <strong>
                                        {{year.name}}
                                    </strong>


                                    <small>
                                        Academic Session
                                    </small>


                                </div>



                            </div>



                        </td>









                        <!-- START DATE -->


                        <td>


                            <div class="date-box">


                                <i class="bi bi-calendar-check"></i>


                                {{year.startDate | date:'dd MMM yyyy'}}


                            </div>


                        </td>









                        <!-- END DATE -->


                        <td>


                            <div class="date-box">


                                <i class="bi bi-calendar-x"></i>


                                {{year.endDate | date:'dd MMM yyyy'}}


                            </div>


                        </td>









                        <!-- STATUS -->


                        <td>


                            <span

                            class="status"

                            [class.active]="year.isActive"

                            [class.inactive]="!year.isActive">



                                <i
                                class="bi"
                                [ngClass]="
                                year.isActive
                                ?
                                'bi-toggle-on'
                                :
                                'bi-toggle-off'
                                ">
                                </i>



                                {{year.isActive ? 'Active':'Inactive'}}



                            </span>


                        </td>









                        <!-- ACTION -->


                        <td class="actions">


                            <button

                            class="action-btn edit-btn"

                            title="Edit Academic Year"

                            (click)="editAcademicYear(year.id)">



                                <i class="bi bi-pencil-square"></i>


                            </button>






                            <button

                            class="action-btn delete-btn"

                            title="Delete Academic Year"

                            (click)="delete(year.id)">



                                <i class="bi bi-trash3-fill"></i>


                            </button>



                        </td>





                    </tr>








                    <!-- EMPTY -->


                    <tr
                    *ngIf="years.length===0">


                        <td
                        colspan="5"
                        class="empty">


                            <i class="bi bi-calendar-x"></i>


                            <br>


                            No academic years found


                        </td>


                    </tr>




                </tbody>




            </table>



        </div>


    </div>






</div>








<!-- EDIT MODAL -->


<app-edit-academic-year

*ngIf="showEditModal"

[academicYearId]="selectedAcademicYearId"

(close)="closeEditModal()"

(updated)="reloadAcademicYears()">


</app-edit-academic-year>



<app-edit-academic-year

*ngIf="showEditModal"

[academicYearId]="selectedAcademicYearId"

(close)="closeEditModal()"

(updated)="reloadAcademicYears()">

</app-edit-academic-year>
